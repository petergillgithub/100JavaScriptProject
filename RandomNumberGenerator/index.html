<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RandomNumber Generater</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h2>Random Number Generator 💯</h2>
      <!-- Buttons and Labels Section -->
      <div class="buttons">
        <label for="min">Minimum:</label>
        <input type="text" placeholder="Minimum" class="minimum" />
        <label for="max">Maximum:</label>
        <input type="text" placeholder="Maximum" class="maximum" />
      </div>
      <!-- Generate Random Number Section -->
      <button class="generteNumBtn">Generate Random Number</button>
      <!-- Input Show Section -->
      <p class="showNumber">Click the button to generate</p>
      <!-- Reset Button Section -->
      <button class="resetBtn">Reset</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
