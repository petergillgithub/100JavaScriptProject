<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do List</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Zen+Kaku+Gothic+New:300,regular,500,700,900"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="to-do-list">
      <h1>Today's task</h1>
      <p>Type a task and press Add or Enter. Click a task to mark it done.</p>
      <div class="container">
        <input type="text" class="taskInput" placeholder="  Enter a Task " />
        <button class="addBtn">Add</button>
      </div>

      <ul class="taskList"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
